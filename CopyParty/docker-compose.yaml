services:
  copyparty:
    image: copyparty/ac:1.19.8
    ports:
      - "3923:3923"
    volumes:
      - ${TEAMTOOLS_HOME:-${HOME}/.local/share/teamtools}/copyparty/config.conf:/cfg/config.conf:ro
      - ${TEAMTOOLS_HOME:-${HOME}/.local/share/teamtools}/copyparty/history:/cfg/hists
      - ${TEAMTOOLS_HOME:-${HOME}/.local/share/teamtools}/copyparty/media:/media
    restart: unless-stopped
